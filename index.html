<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Cold Steel</title>
  <link rel="icon" href="icons/favicon-64.png">
  <!-- installable (PWA): manifest, icons; the service worker is registered by src/pwa/register.js -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#10120c">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/menu.css">
  <!-- Libraries (three, peerjs) come from npm and are bundled by Vite: `npm run dev` / `npm run build`. -->
</head>
<body>
  <div id="app"></div>
  <div id="labels"></div>
  <div id="select-box" hidden></div>

  <div id="hud">
    <div id="crosshair"><span></span></div>

    <div id="topbar">
      <div class="tb-left"><div id="mode-badge">Command</div><button type="button" tabindex="-1" id="keys-open" class="mouse-only" title="Keys and mouse (F1)">?</button></div>
      <div id="battle-status">
        <span class="ally"><b id="ally-count">0</b> allied stacks</span>
        <span class="vs">vs</span>
        <span class="enemy"><b id="enemy-count">0</b> enemy stacks</span>
      </div>
      <div id="fps" hidden>-- fps</div>
      <div id="suppress-vignette"></div>
    </div>

    <div id="vitals">
      <div id="unit-name"></div>
      <div class="meter">
        <label>Health</label>
        <div class="bar hp"><i id="hp-fill"></i></div>
        <span id="hp-text">--</span>
      </div>
      <div class="meter">
        <label id="ammo-label">Ammo</label>
        <div class="bar heat" id="ammo-bar"><i id="ammo-fill"></i></div>
        <span id="ammo-text">--</span>
      </div>
    </div>

    <div id="command-panel">
      <div class="sel-head">
        <div id="selection-info">No stacks selected</div>
        <button type="button" tabindex="-1" class="sel-all" data-cmd="selectAll" title="Select all your stacks">All <kbd data-key="selectAll"></kbd></button>
      </div>
      <!-- what the selection can do, and the support powers (src/ui/ActionBar.js) -->
      <div id="cmd-actions" class="cmd-buttons" hidden></div>
      <div class="cmd-buttons support"></div>
    </div>
    <div id="target-hint" hidden></div>
    <div id="key-card" hidden></div>

    <div id="lock-hint">Click to aim</div>
    <div id="rotate-hint"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="14" y="6" width="20" height="36" rx="3"/><path d="M8 30a16 16 0 0 0 14 12m-3 -4 3 4 -4 2"/></svg><b>Turn your phone sideways</b><span>Battles are played in landscape.</span></div>
    <div id="toasts"></div>

    <div id="banner" hidden>
      <h1></h1>
      <p></p>
      <div class="banner-buttons">
        <button tabindex="-1" data-act="again">Play again <kbd>R</kbd></button>
        <button tabindex="-1" data-act="menu">Main menu</button>
      </div>
    </div>
  </div>

  <!-- Title screen while the scripts load; src/main.js turns it into the main menu (ui/MainMenu.js). -->
  <div id="loading" class="title-screen boot">
    <div class="boot-card">
      <div class="logo"><img class="logo-art" src="brand/mark.svg" alt="Cold Steel" width="605" height="268"><span class="logo-tag">World War III, 1985</span></div>
      <div id="ts-status">Loading…</div>
      <small class="ts-note">If this stays here, start the game with <b>start.bat</b> — browsers won't load ES modules from a double-clicked file.</small>
    </div>
  </div>

  <script>
    // Surface startup errors on the loading screen instead of failing silently.
    function showBootError(msg) {
      var el = document.getElementById('loading');
      if (!el) return;
      var p = document.createElement('pre');
      p.id = 'boot-error';
      p.style.cssText = 'color:#ff6a55;white-space:pre-wrap;max-width:720px;text-align:left';
      p.textContent = msg;
      el.appendChild(p);
    }
    window.addEventListener('error', function (e) { showBootError(e.message + (e.filename ? '\n' + e.filename + ':' + e.lineno : '')); });
    window.addEventListener('unhandledrejection', function (e) { showBootError(String(e.reason && e.reason.stack || e.reason)); });
    // A missing module file fails silently (no error event): say so if nothing has booted.
    setTimeout(function () {
      if (!window.booted && !window.game && !document.getElementById('boot-error')) showBootError('The game did not finish loading — a file may be missing. Press F12 and look at the Console for a red 404.');
    }, 45000);
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
